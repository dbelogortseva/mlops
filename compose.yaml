services:
  api:
    build: .
    image: mlops-playground:1.0
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: artifact/model.joblib
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mlops
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
